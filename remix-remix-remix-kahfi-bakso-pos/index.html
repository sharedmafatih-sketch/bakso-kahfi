<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      // Filter harmless Vite dev-server HMR / WebSocket reconnection noise in sandbox iFrame environment
      window.addEventListener('error', function(e) {
        if (e && (
          (e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) ||
          (e.filename && e.filename.includes('@vite/client'))
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && e.reason;
        var msg = reason && (reason.message || String(reason));
        if (msg && (msg.includes('WebSocket') || msg.includes('vite'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>KAHFI BAKSO POS</title>
